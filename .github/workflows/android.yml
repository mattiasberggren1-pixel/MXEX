# Bygger en installerbar Android-APK och lägger den under Releases.
# Kör: skapa en tagg, t.ex. `git tag v1.0.0 && git push --tags`, eller starta manuellt under Actions.
name: Android APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npx expo prebuild --platform android --no-install
      - name: Bygg APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk DialedMX.apk
      - uses: actions/upload-artifact@v4
        with:
          name: DialedMX-apk
          path: DialedMX.apk
      - name: Publicera release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: DialedMX.apk
