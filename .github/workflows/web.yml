# Publicerar webbversionen på GitHub Pages – funkar i alla mobilwebbläsare
# (iPhone: Dela → "Lägg till på hemskärmen").
name: Webbapp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sätt sökväg för GitHub Pages
        run: node -e "const f='app.json',a=require('./'+f);a.expo.experiments={...a.expo.experiments,baseUrl:'/${{ github.event.repository.name }}'};require('fs').writeFileSync(f,JSON.stringify(a,null,2))"
      - run: npx expo export --platform web
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
